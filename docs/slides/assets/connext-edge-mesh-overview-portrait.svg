<svg xmlns="http://www.w3.org/2000/svg" width="840" height="860" viewBox="0 0 840 860" role="img" aria-labelledby="title desc">
  <title id="title">Current Connext edge mesh architecture</title>
  <desc id="desc">A browser dashboard connects to the control node's local DDS dashboard bridge. One router on each node connects its local application domain to shared WAN domain 200. Platform 30 and additional platforms have separate local DDS domains. EMANE provides constrained links in the test rig.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#004c97"/>
    </marker>
    <style>
      text { font-family: Arial, "Liberation Sans", sans-serif; fill: #333; font-size: 22px; text-anchor: middle; }
      .heading { fill: #004c97; font-weight: bold; font-size: 25px; }
      .white { fill: white; font-weight: bold; }
      .small { font-size: 19px; }
      .node { fill: #f2f4f6; stroke: #bbbcbc; stroke-width: 2; }
      .app { fill: white; stroke: #004c97; stroke-width: 2; }
      .router { fill: #004c97; }
      .link { fill: none; stroke: #004c97; stroke-width: 3; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="215" y="12" width="410" height="54" rx="8" class="app"/>
  <text x="420" y="46">Browser dashboard</text>
  <text x="502" y="118" class="small">HTTP / WS</text>

  <rect x="140" y="130" width="560" height="280" rx="10" class="node"/>
  <path d="M420 78 V100 H156 V220 H168" class="link"/>
  <text x="420" y="165" class="heading">C2 / control node</text>
  <rect x="180" y="185" width="480" height="70" rx="6" class="app"/>
  <text x="420" y="214">C2 applications</text>
  <text x="420" y="240" class="small">+ local DDS dashboard bridge</text>
  <path d="M420 267 V335" class="link"/>
  <rect x="252" y="286" width="336" height="30" fill="#f2f4f6"/>
  <text x="420" y="307" class="small">Local DDS LAN: domain 20</text>
  <rect x="230" y="347" width="380" height="48" rx="6" class="router"/>
  <text x="420" y="378" class="white">Connext router</text>
  <path d="M420 420 V456" class="link"/>

  <rect x="15" y="470" width="810" height="90" rx="8" fill="#fff1df" stroke="#ed8b00" stroke-width="2"/>
  <text x="420" y="506" class="heading">Shared WAN DDS: domain 200</text>
  <text x="420" y="538">Constrained links (EMANE in the test rig)</text>
  <rect x="15" y="598" width="390" height="250" rx="10" class="node"/>
  <path d="M210 572 V584 H28 V678 H33" class="link"/>
  <text x="210" y="635" class="heading">Platform 30</text>
  <rect x="45" y="654" width="330" height="48" rx="6" class="router"/>
  <text x="210" y="685" class="white">Connext router</text>
  <path d="M210 714 V776" class="link"/>
  <rect x="54" y="729" width="312" height="28" fill="#f2f4f6"/>
  <text x="210" y="750" class="small">Local DDS LAN: domain 30</text>
  <rect x="35" y="788" width="350" height="44" rx="6" class="app"/>
  <text x="210" y="816" class="small">Platform applications / sim</text>

  <rect x="435" y="598" width="390" height="250" rx="10" class="node"/>
  <path d="M630 572 V584 H448 V678 H453" class="link"/>
  <text x="630" y="635" class="heading">Platform 31 ... N</text>
  <rect x="465" y="654" width="330" height="48" rx="6" class="router"/>
  <text x="630" y="685" class="white">Connext router per node</text>
  <path d="M630 714 V776" class="link"/>
  <rect x="447" y="729" width="366" height="28" fill="#f2f4f6"/>
  <text x="630" y="750" class="small">Separate DDS LAN per platform</text>
  <rect x="455" y="788" width="350" height="44" rx="6" class="app"/>
  <text x="630" y="816" class="small">Platform applications / sim</text>
</svg>
