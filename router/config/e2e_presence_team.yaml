# e2e_presence_team.yaml — verifies RouterHealth.team_partition (the mesh-dashboard
# team-grouping follow-on to Phase 16 v1, gui/mesh_dashboard/): does platform_wan's live
# participant_partition set (D83/D103) actually ride the WAN heartbeat (control_wan/
# platform_wan match via control_wan's standing wildcard, D103) and flow untouched
# through PresenceMonitor's roster copy into the ActRouterMeshStatus aggregate, for a
# real ADD_PARTICIPANT_PARTITION-driven team assignment.
#
# Three-process shape sharing this one file: one control-role process (--role control)
# plus two platform-role processes (--role platform, --node-name Platform_30 /
# Platform_31) on distinct platform_lan domains (own app-LAN traffic never crosses) but
# the SAME control_wan/platform_wan WAN domain — one physical network, matching
# control-platform.yaml's real topology (D103: team_wan is retired, its role folded
# directly into platform_wan).
#
# Domain placeholders substituted by test_mesh_team_partition.py's own render helper
# (this fixture needs one more placeholder than conftest's generic render_config knows,
# since two DIFFERENT renders of platform_lan are needed for the two platform processes —
# same pattern as e2e_team_partition.yaml).

node:
  name: Platform_30
  role: platform   # overridden per-process by --role/--node-name

router:
  name: e2e-presence-team
  admin_participant: platform_lan   # control-role process overrides via --admin-participant
  presence_participant:
    platform: platform_wan
    control: control_wan

types:
  xml: harness_v2/datamodel/gen/ActTypes.xml

qos_libraries:
  - harness_v2/qos/act_qos_profiles.xml

qos_profiles:
  router_lan_participant: ACT_QOS_LIB::lan_router_participant
  wan_participant: ACT_QOS_LIB::wan_router_participant
  router_health: ACT_QOS_LIB::router_health

participants:
  control_lan:
    role: control
    domain: __DOMAIN_CONTROL_LAN__
    qos: router_lan_participant
  control_wan:
    role: control
    domain: __DOMAIN_WAN__
    qos: wan_participant
    on_wan: true   # link-stats WAN-leg coverage (is_wan decomposition)
    # D103: platform_wan is team_scoped below (no longer on the free default partition),
    # so control_wan needs a standing, protected wildcard to keep matching it — this
    # fixture's whole point (proving team_partition still rides the control<->platform
    # leg) depends on this match holding.
    protected_partition_entries: ["*"]
  platform_lan:
    role: platform
    domain: __DOMAIN_PLATFORM_LAN__
    qos: router_lan_participant
  platform_wan:
    role: platform
    domain: __DOMAIN_WAN__
    qos: wan_participant
    team_scoped: true  # D83/D103: protected-identity partition (renamed from `wan:`;
                       # absorbed from team_wan under D103).
    on_wan: true   # link-stats WAN-leg coverage (is_wan decomposition)
    # participant_partition omitted: defaults to the protected {"${node.name}"} entry
    # alone (D83) — team membership starts disjoint, assigned at runtime by the test.

routes:
  - name: platform_team_to_wan
    enabled: true
    forwarding_mode: dynamic_data
    source: platform
    destination: platform
    source_side:
      input:
        participant: platform_lan
        reader_qos: default
      output:
        participant: platform_wan
        writer_qos: default
    topics:
      - name: PlatformData

  - name: wan_team_to_platform
    enabled: true
    forwarding_mode: dynamic_data
    source: platform
    destination: platform
    source_side:
      input:
        participant: platform_wan
        reader_qos: default
      output:
        participant: platform_lan
        writer_qos: default
    topics:
      - name: PlatformData
