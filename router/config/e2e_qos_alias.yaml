# e2e_qos_alias.yaml — single router_main fixture for the Phase 7a QoS-alias e2e test
# (router/test_e2e/test_qos_alias_route.py, plan's E1/E2, D60).
#
# ONE router process (role: platform) owns both legs of route qos_alias_r1, using the REAL
# production QoS libraries and alias names (not a synthetic stand-in) so this is a genuine
# proof that control-platform.yaml's aliases resolve: reader_qos: wan_status and
# writer_qos: wan_event, plus the shared wan_participant profile applied to wan_in/wan_out.
# Same single-process topology as e2e_auto_qos.yaml (this test's Python port
# fixture for Phase 5) — the app writer/reader the test creates are the matched peers.
#
# The canonical QoS XML is templated with WAN_PEER and WAN tuning variables; the e2e harness
# supplies loopback/test values before launching router_main.
#
# Domain placeholders substituted per test run — see router/test_e2e/conftest.py
# (control_lan -> wan_in's domain, platform_lan -> wan_out's domain; wan unused here).

node:
  name: Platform_30
  role: platform

router:
  name: qosalias
  admin_participant: wan_in

types:
  xml: router/config/example_types.xml

qos_libraries:
  - harness_v2/qos/act_qos_profiles.xml

qos_profiles:
  wan_status: WAN_QOS_LIB::status_qos
  wan_event: WAN_QOS_LIB::event_qos
  wan_participant: WAN_QOS_LIB::wan_participant_udpv4_qos

participants:
  wan_in:
    role: platform
    domain: __DOMAIN_CONTROL_LAN__
    qos: wan_participant
  wan_out:
    role: platform
    domain: __DOMAIN_PLATFORM_LAN__
    qos: wan_participant

routes:
  - name: qos_alias_r1
    enabled: true
    forwarding_mode: dynamic_data
    # source == destination == this node's role: the single platform process materializes
    # source_side (RouteConfigParser picks source_side when node_role == source).
    source: platform
    destination: control
    topics:
      - name: QosAliasCmd
    source_side:
      input:
        participant: wan_in
        reader_qos: wan_status
      output:
        participant: wan_out
        writer_qos: wan_event
