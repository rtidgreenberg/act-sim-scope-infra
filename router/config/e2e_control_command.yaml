# e2e_control_command.yaml — router_main-runnable fixture for the Python e2e suite
# (router/test_e2e/). Same node/topology shape as control-platform.yaml's control_command
# route, but sidesteps the two things router_main can't do yet (docs/cpp_router/
# design-decisions.md D50):
#   - qos: "" (auto) on LAN-local legs and reader sides, instead of named aliases
#     (wan_event/wan_status/...), which are unresolvable until Phase 7 (D45).
#   - the WAN-crossing output leg (source_side.output here) uses writer_qos: default
#     rather than "" — an auto-QoS output writer won't build until it has already
#     discovered a matched reader (Phase 5 derivation, D39), which two independent
#     router_main processes each waiting on the other's not-yet-built WAN entity can
#     never satisfy (a real mutual-deadlock bug, not test-fixture-specific — see
#     docs/cpp_router/design-decisions.md D51). "default" is a real, already-shipped
#     alias, not a fixture-only workaround.
#   - router.type_name names the ONE DynamicData type this process's DynamicRouteFactory
#     is bound to (D34/D35 multi-type dispatch isn't implemented) — only the
#     control_command route/type is included, not the full control-platform.yaml route set.
#
# Loaded twice by the test harness against the SAME file: once with --role control, once
# with --role platform (mirrors how control-platform.yaml is meant to be loaded on both
# nodes). Domain placeholders are substituted per test run for isolation — see
# router/test_e2e/conftest.py.

node:
  name: Platform_30
  role: platform   # overridden per-process by --role

router:
  id: 30
  name: e2e-control-command
  type_name: control_command
  # Default admin participant for the file's own (platform) role; the control-role
  # process launched against this same file overrides this with
  # --admin-participant control_lan (see router/test_e2e/conftest.py).
  admin_participant: platform_lan

types:
  xml: harness/act/node_sim/datamodel/act_types.xml

participants:
  control_lan:
    role: control
    domain: __DOMAIN_CONTROL_LAN__
  control_wan:
    role: control
    domain: __DOMAIN_WAN__
  platform_lan:
    role: platform
    domain: __DOMAIN_PLATFORM_LAN__
  platform_wan:
    role: platform
    domain: __DOMAIN_WAN__

routes:
  - name: control_command
    enabled: true
    forwarding_mode: dynamic_data
    source: control
    destination: platform
    topics:
      - name: ControlCommand
    source_side:
      input:
        participant: control_lan
      output:
        participant: control_wan
        writer_qos: default
    destination_side:
      input:
        participant: platform_wan
        filter:
          expression: "msg.destination = %0"
          parameters: ["${node.name}"]
      output:
        participant: platform_lan
