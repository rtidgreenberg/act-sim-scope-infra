# platform-team router config (historical identity-only fixture — see below).
#
# D80 retires the two-file model: these team↔team routes now live folded into
# control-platform.yaml's role-pair form (the single system-wide config every node
# loads — D79/D80), alongside the control<->platform routes, so a platform node runs
# ONE router_main process for both. This file is kept only because
# test/test_config_identity.cxx's Phase-0 identity reader (node.*/router.* only, never
# routes:/participants:) uses it as a "distinct config_set" fixture; its routes: /
# participants: below are historical and are not exercised by RouteConfigParser in any
# test — see control-platform.yaml's platform_wan participant + platform_team_to_wan /
# wan_team_to_platform routes for the real, currently-parsed shape.
#
# Team scope is set by platform_wan.participant_partition (D103: team_wan is retired,
# platform_wan absorbed its role), a multi-valued set (D83): a protected node-identity
# entry (default "${node.name}", never removable by command) + optional team entries,
# mutated live via ADD_PARTICIPANT_PARTITION / REMOVE_PARTICIPANT_PARTITION
# (SET_PARTICIPANT_PARTITION and the inherit_participant sentinel are both retired —
# D73/D83).
#
# Source: docs/cpp_router/configuration.md "Platform/Team Config Example" (authoritative).

node:
  name: Platform_30
  role: platform

router:
  name: platform-30-team
  config_set: platform-team
  default_forwarding_mode: dynamic_data

participants:
  platform_lan:
    role: platform
    domain: 30
  platform_wan:
    role: platform
    domain: 200
    qos: platform_wan_udpv4_qos
    team_scoped: true  # D83/D103: protected-identity partition (renamed from `wan:` in
                       # the is_wan decomposition; absorbed from team_wan under D103).
    on_wan: true       # link-stats WAN-leg coverage — every WAN participant.
    spdp2: true        # D78 (reinstated, D92 CORRECTION): SPDP2|SEDP for this WAN participant.
    # participant_partition omitted: defaults to the protected {"${node.name}"} entry
    # alone (team disabled by default, D83) — team membership is added at runtime via
    # ADD_PARTICIPANT_PARTITION.

routes:
  - name: platform_team_to_wan
    enabled: true
    forwarding_mode: dynamic_data
    source: platform
    destination: platform
    source_side:
      input:
        participant: platform_lan
      output:
        participant: platform_wan
        writer_qos: wan_status
    topics:
      - name: PlatformData

  - name: wan_team_to_platform
    enabled: true
    forwarding_mode: dynamic_data
    source: platform
    destination: platform
    source_side:
      input:
        participant: platform_wan
        reader_qos: wan_status
      output:
        participant: platform_lan
    topics:
      - name: PlatformData
