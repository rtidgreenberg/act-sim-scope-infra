# e2e_auto_qos.yaml — fixed default-profile and incompatibility e2e fixture
# (router/test_e2e/test_auto_qos.py).
#
# ONE router process (role: platform) owns both legs of route auto_r1. Empty QoS aliases
# select the production router_default_reader and router_default_writer profiles.
# Discovered peer requests must not derive or retune these fixed policies.
#
# Domain placeholders substituted per test run — see router/test_e2e/conftest.py
# (control_lan -> input domain, platform_lan -> output domain; wan unused here).

node:
  name: Platform_30
  role: platform

router:
  name: autoqos
  admin_participant: wan_in

types:
  xml: router/config/example_types.xml

qos_libraries:
  - harness_v2/qos/act_qos_profiles.xml

qos_profiles:
  router_lan_participant: ACT_QOS_LIB::lan_router_participant

participants:
  wan_in:
    role: platform
    domain: __DOMAIN_CONTROL_LAN__
    qos: router_lan_participant
  lan_out:
    role: platform
    domain: __DOMAIN_PLATFORM_LAN__
    qos: router_lan_participant

routes:
  - name: auto_r1
    enabled: true
    forwarding_mode: dynamic_data
    # source == destination == this node's role: the single platform process materializes
    # source_side (RouteConfigParser picks source_side when node_role == source).
    source: platform
    destination: control
    topics:
      - name: AutoQosCmd
    source_side:
      input:
        participant: wan_in
        reader_qos: ""
      output:
        participant: lan_out
        writer_qos: ""
