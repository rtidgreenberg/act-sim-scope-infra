# control-platform router config — the single system-wide config (D80): every node (C2
# and every platform) loads THIS ONE file; node identity is injected per node
# (--role/--node-name). It carries every route family — control<->platform AND
# platform<->platform team (D103: team_wan is retired, its role folded into
# platform_wan/control_wan directly — see design-decisions.md D84/D85/D89/D103) — so a
# platform node runs ONE router_main process for all of it (D79: one router per node).
# Each logical route is defined once; the local node.role selects source_side vs
# destination_side (same-role pairs, e.g. the team routes below, always resolve to
# source_side — D80).
#
# Source: docs/cpp_router/configuration.md "Control/Platform Config Example" (authoritative).
# router_main parses the full route/participant shape below (RouteConfigParser), but the
# named qos_profiles aliases (wan_event, wan_status, etc.) resolve via the QosProvider
# (7a, D65) and topic types are wire-learned (7c, D70) — the full-config two-process run
# is Phase 7d; see docs/cpp_router/design-decisions.md D66/D70.

node:
  name: Platform_30
  role: platform   # control or platform

router:
  name: platform-30-control-platform
  config_set: control-platform
  default_forwarding_mode: dynamic_data
  # Default admin participant for this file's own (platform) role; a control-node
  # deployment of this same file overrides this with --admin-participant control_lan.
  admin_participant: platform_lan
  # Phase 8 (D75): the RouterHealth heartbeat pair rides this role's WAN participant;
  # the ActRouterMeshStatus aggregate rides the admin (LAN) participant.
  presence_participant:
    control: control_wan
    platform: platform_wan

control:
  domain: 100
  command_topic: ActRouterCommand
  status_topic: ActRouterStatus
  target_node: Platform_30
  target_router: platform-30-control-platform

types:
  xml: harness_v2/datamodel/gen/ActTypes.xml

qos_libraries:
  - harness_v2/qos/lan_qos_lib.xml
  - harness_v2/qos/wan_qos_lib.xml
  - relay/qos_isc.xml

qos_profiles:
  control_wan_udpv4_qos: WAN_QOS_LIB::control_participant_udpv4_qos
  platform_wan_udpv4_qos: WAN_QOS_LIB::platform_participant_udpv4_qos
  wan_event: WAN_QOS_LIB::event_qos
  wan_status: WAN_QOS_LIB::status_qos
  lan_status_1hz: LAN_QOS_LIB::status_1sec_qos

participants:
  control_lan:
    role: control
    domain: 20
  control_wan:
    role: control
    domain: 200
    qos: control_wan_udpv4_qos
    on_wan: true   # link-stats WAN-leg coverage: this participant's route legs are on the
                   # WAN, so the LinkStatsCollector polls them (is_wan decomposition).
    spdp2: true    # D78 (reinstated, D92 CORRECTION): WAN participants use SPDP2|SEDP.
    # D103: platform_wan is now team_scoped (see below), so it's no longer on the free
    # default ("") partition D87 relied on for unconditional control<->platform matching.
    # control_wan gets a standing, PROTECTED (non-removable) wildcard entry instead —
    # protected_partition_entries auto-seeds "*" into participant_partition at parse time
    # (RouteConfigParser) and REMOVE_PARTICIPANT_PARTITION rejects removing it
    # (is_protected_partition_name, RouterState.hpp), the same non-removable treatment D83
    # gives a team_scoped participant's own identity entry. Not team_scoped itself — a
    # wildcard is not a node-identity entry, and marking control_wan team_scoped would
    # reopen D87's exact "Control_20 vs Platform_30 disjoint identity" bug if the wildcard
    # were ever removed. Accepted cost (design-decisions.md D103, revisiting D84/D85/D89):
    # this wildcard gives control_wan full SEDP endpoint-metadata visibility into every
    # platform_wan endpoint including former team-only ones — bounded by C2 node count
    # (1-2 expected), not team/platform count.
    protected_partition_entries: ["*"]
  platform_lan:
    role: platform
    domain: 30
  # D103: team_wan is retired. Its D83 protected-identity + team + ad-hoc-tap partition
  # mechanism now lives directly on platform_wan (team_scoped: true below) — see
  # design-decisions.md D84 (proposed this merge) / D85 (reverted it) / D89 (rejected the
  # wildcard variant again) / D103 (does it anyway, on a C2-node-count-bounded rationale
  # D85/D89 didn't have). Team-to-team isolation is unchanged: different teams still carry
  # disjoint concrete platform_wan partition sets, so they still exchange zero SEDP with
  # each other — only C2's view (via control_wan's wildcard above) is now broader.
  platform_wan:
    role: platform
    domain: 200
    qos: platform_wan_udpv4_qos
    team_scoped: true  # D83/D103: protected-identity partition + non-removable
                       # protection, absorbed from team_wan.
    on_wan: true       # link-stats WAN-leg coverage (is_wan decomposition) — carries the
                       # platform<->C2 status/event/command data legs AND platform<->
                       # platform team traffic (D103).
    spdp2: true        # D78 (reinstated): SPDP2|SEDP for this WAN participant.
    # participant_partition omitted: defaults to the protected {"${node.name}"} entry
    # alone (D83 — "team disabled by default" falls out of the shared config itself).
    # Team membership / direct-peer taps are added at runtime via
    # ADD_PARTICIPANT_PARTITION platform_wan=<name>.

routes:
  - name: control_command
    enabled: true
    forwarding_mode: dynamic_data
    source: control
    destination: platform
    topics:
      - name: ControlCommand
    source_side:
      input:
        participant: control_lan
      output:
        participant: control_wan
        writer_qos: wan_event
        publisher_partition: CONTROL
    destination_side:
      input:
        participant: platform_wan
        reader_qos: wan_event
        subscriber_partition: CONTROL
        filter:
          expression: "msg.destination = %0"
          parameters: ["${node.name}"]
      output:
        participant: platform_lan

  # Unfiltered control→platform event route (team-control-topic-plan.md). Same shape as
  # control_command but NO CFT filter — all platforms receive all samples. Used for
  # broadcast control topics like TeamAssignment where every platform needs every sample
  # and the platform mesh control process filters locally.
  - name: control_event
    enabled: true
    forwarding_mode: dynamic_data
    source: control
    destination: platform
    topics:
      - name: ActTeamAssignment
    source_side:
      input:
        participant: control_lan
      output:
        participant: control_wan
        writer_qos: wan_event
        publisher_partition: CONTROL
    destination_side:
      input:
        participant: platform_wan
        reader_qos: wan_event
        subscriber_partition: CONTROL
      output:
        participant: platform_lan

  # Per-platform status resolution control (primary/detail/debug). Unlike TeamAssignment,
  # this path is targeted at the router layer via destination-side CFT using the sample's
  # platform_node key so platform mesh control receives only local-node commands.
  - name: control_status_mode
    enabled: true
    forwarding_mode: dynamic_data
    source: control
    destination: platform
    topics:
      - name: ActPlatformStatusMode
    source_side:
      input:
        participant: control_lan
      output:
        participant: control_wan
        writer_qos: wan_event
        publisher_partition: CONTROL
    destination_side:
      input:
        participant: platform_wan
        reader_qos: wan_event
        subscriber_partition: CONTROL
        filter:
          expression: "platform_node = %0"
          parameters: ["${node.name}"]
      output:
        participant: platform_lan

  - name: platform_init_status
    enabled: true
    forwarding_mode: dynamic_data
    source: platform
    destination: control
    topics:
      - name: PlatformInitStatus
    source_side:
      input:
        participant: platform_lan
        reader_qos: lan_status_1hz
      output:
        participant: platform_wan
        writer_qos: wan_status
        publisher_partition: PLATFORM
    destination_side:
      input:
        participant: control_wan
        reader_qos: wan_status
        subscriber_partition: PLATFORM
      output:
        participant: control_lan

  - name: platform_detail_status
    enabled: false
    forwarding_mode: dynamic_data
    source: platform
    destination: control
    topics:
      - name: PlatformDetailStatus
      - name: PlatformMissionStatus
      - name: PlatformWaypointStatus
    source_side:
      input:
        participant: platform_lan
      output:
        participant: platform_wan
        writer_qos: wan_status
        publisher_partition: PLATFORM
    destination_side:
      enabled: true   # D120: C2 relay always ready; gating is source-side only
      input:
        participant: control_wan
        reader_qos: wan_status
        subscriber_partition: PLATFORM
      output:
        participant: control_lan

  - name: platform_debug_status
    enabled: false
    forwarding_mode: dynamic_data
    source: platform
    destination: control
    topics:
      - name: PlatformDebugStatus
      - name: PlatformThrusterStatus
      - name: PlatformPowerStatus
    source_side:
      input:
        participant: platform_lan
      output:
        participant: platform_wan
        writer_qos: wan_status
        publisher_partition: PLATFORM
    destination_side:
      enabled: true   # D120: C2 relay always ready; gating is source-side only
      input:
        participant: control_wan
        reader_qos: wan_status
        subscriber_partition: PLATFORM
      output:
        participant: control_lan

  - name: platform_events
    enabled: true
    forwarding_mode: dynamic_data
    source: platform
    destination: control
    topics:
      - name: PlatformCommandAck
      - name: ContactReport
    source_side:
      input:
        participant: platform_lan
      output:
        participant: platform_wan
        writer_qos: wan_event
        publisher_partition: PLATFORM
    destination_side:
      input:
        participant: control_wan
        reader_qos: wan_event
        subscriber_partition: PLATFORM
      output:
        participant: control_lan

  # Platform<->platform team routes (D80/D83; historically platform-team.yaml's flat
  # form, now folded into this single system-wide config in role-pair form). Both
  # legs are role "platform", so each direction is its own route and both always
  # resolve to source_side (D80). No endpoint-level partition here — platform_wan's own
  # participant-level partition set is the entire scoping mechanism (D73/D83/D103,
  # absorbing team_wan's former role); the retired inherit_participant sentinel is gone.
  - name: platform_team_to_wan
    enabled: true
    forwarding_mode: dynamic_data
    source: platform
    destination: platform
    source_side:
      input:
        participant: platform_lan
      output:
        participant: platform_wan
        writer_qos: wan_status
    topics:
      - name: PlatformData

  - name: wan_team_to_platform
    enabled: true
    forwarding_mode: dynamic_data
    source: platform
    destination: platform
    source_side:
      input:
        participant: platform_wan
        reader_qos: wan_status
      output:
        participant: platform_lan
    topics:
      - name: PlatformData
