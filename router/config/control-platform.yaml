# control-platform router config — the single system-wide config (D80): every node (C2
# and every platform) loads THIS ONE file; node identity is injected per node
# (--role/--node-name). It carries every route family — control<->platform AND
# platform<->platform team and global navigation on one WAN participant per role — so a
# platform node runs ONE router_main process for all of it (D79: one router per node).
# Each logical route is defined once; the local node.role selects source_side vs
# destination_side (same-role pairs, e.g. the team routes below, always resolve to
# source_side — D80).
#
# Source: docs/cpp_router/configuration.md "Control/Platform Config Example" (authoritative).
# router_main parses the full route/participant shape below (RouteConfigParser), but the
# named qos_profiles aliases (wan_event, wan_status, etc.) resolve via the QosProvider
# (7a, D65) and topic types are wire-learned (7c, D70) — the full-config two-process run
# is Phase 7d; see docs/cpp_router/design-decisions.md D66/D70.

node:
  name: Platform_30
  role: platform   # control or platform

router:
  name: platform-30-control-platform
  config_set: control-platform
  default_forwarding_mode: dynamic_data
  # Default admin participant for this file's own (platform) role; a control-node
  # deployment of this same file overrides this with --admin-participant control_lan.
  admin_participant: platform_lan
  # Phase 8 (D75): the RouterHealth heartbeat pair rides this role's WAN participant;
  # the ActRouterMeshStatus aggregate rides the admin (LAN) participant.
  presence_participant:
    control: control_wan
    platform: platform_wan

control:
  domain: 100
  command_topic: ActRouterCommand
  status_topic: ActRouterStatus
  target_node: Platform_30
  target_router: platform-30-control-platform

types:
  xml: harness_v2/datamodel/gen/ActTypes.xml

qos_libraries:
  - harness_v2/qos/act_qos_profiles.xml

qos_profiles:
  router_lan_participant: ACT_QOS_LIB::lan_router_participant
  control_router_lan_participant: ACT_QOS_LIB::lan_control_router_participant
  wan_participant: ACT_QOS_LIB::wan_router_participant
  wan_participant_emane: ACT_QOS_LIB::wan_router_participant_emane
  wan_event: ACT_QOS_LIB::wan_event
  router_health: ACT_QOS_LIB::router_health
  wan_status: ACT_QOS_LIB::wan_status
  lan_event: ACT_QOS_LIB::lan_event
  lan_status_1hz: ACT_QOS_LIB::lan_status_1s

participants:
  control_lan:
    role: control
    domain: 20
    qos: control_router_lan_participant
  control_wan:
    role: control
    domain: 200
    qos: wan_participant
    on_wan: true   # link-stats WAN-leg coverage: this participant's route legs are on the
                   # WAN, so the LinkStatsCollector polls them (is_wan decomposition).
    protected_partition_entries: ["SHARED"]
  platform_lan:
    role: platform
    domain: 30
    qos: router_lan_participant
  # Discovery is squad-wide; team/ad-hoc membership scopes only default-partition
  # route Publisher/Subscriber parents. Fixed CONTROL/PLATFORM/NAVIGATION audiences
  # are independent of assignment. Health retains its existing 3 s lease.
  platform_wan:
    role: platform
    domain: 200
    qos: wan_participant
    team_scoped: true
    team_partitions_on_endpoints: true
    protected_partition_entries: ["SHARED"]
    on_wan: true
    # ADD/REMOVE_PARTICIPANT_PARTITION platform_wan=<name> now updates the team
    # endpoint set, starting at the protected node identity. Discovery stays SHARED.

routes:
  - name: control_command
    enabled: true
    forwarding_mode: dynamic_data
    source: control
    destination: platform
    topics:
      - name: ControlCommand
    source_side:
      input:
        participant: control_lan
        reader_qos: lan_event
      output:
        participant: control_wan
        writer_qos: wan_event
        publisher_partition: CONTROL
    destination_side:
      input:
        participant: platform_wan
        reader_qos: wan_event
        subscriber_partition: CONTROL
        filter:
          expression: "destination = %0"
          parameters: ["${node.name}"]
      output:
        participant: platform_lan
        writer_qos: lan_event

  # Unfiltered control→platform event route (team-control-topic-plan.md). Same shape as
  # control_command but NO CFT filter — all platforms receive all samples. Used for
  # broadcast control topics like TeamAssignment where every platform needs every sample
  # and the platform mesh control process filters locally.
  - name: control_event
    enabled: true
    forwarding_mode: dynamic_data
    source: control
    destination: platform
    topics:
      - name: ActTeamAssignment
    source_side:
      input:
        participant: control_lan
      output:
        participant: control_wan
        writer_qos: wan_event
        publisher_partition: CONTROL
    destination_side:
      input:
        participant: platform_wan
        reader_qos: wan_event
        subscriber_partition: CONTROL
      output:
        participant: platform_lan

  # Per-platform status resolution control (primary/detail/debug). Unlike TeamAssignment,
  # this path is targeted at the router layer via destination-side CFT using the sample's
  # platform_node key so platform mesh control receives only local-node commands.
  - name: control_status_mode
    enabled: true
    forwarding_mode: dynamic_data
    source: control
    destination: platform
    topics:
      - name: ActPlatformStatusMode
    source_side:
      input:
        participant: control_lan
      output:
        participant: control_wan
        writer_qos: wan_event
        publisher_partition: CONTROL
    destination_side:
      input:
        participant: platform_wan
        reader_qos: wan_event
        subscriber_partition: CONTROL
        filter:
          expression: "platform_node = %0"
          parameters: ["${node.name}"]
      output:
        participant: platform_lan

  - name: platform_init_status
    enabled: true
    forwarding_mode: dynamic_data
    source: platform
    destination: control
    topics:
      - name: PlatformInitStatus
    source_side:
      input:
        participant: platform_lan
        reader_qos: lan_status_1hz
      output:
        participant: platform_wan
        writer_qos: wan_status
        publisher_partition: PLATFORM
    destination_side:
      input:
        participant: control_wan
        reader_qos: wan_status
        subscriber_partition: PLATFORM
      output:
        participant: control_lan

  - name: platform_locations_to_wan
    enabled: true
    forwarding_mode: dynamic_data
    source: platform
    destination: platform
    topics:
      - name: PlatformInitStatus
    source_side:
      input:
        participant: platform_lan
        reader_qos: lan_status_1hz
      output:
        participant: platform_wan
        writer_qos: wan_status
        publisher_partition: NAVIGATION

  - name: wan_locations_to_platform
    enabled: true
    forwarding_mode: dynamic_data
    source: platform
    destination: platform
    topics:
      - name: PlatformInitStatus
    source_side:
      input:
        participant: platform_wan
        reader_qos: wan_status
        subscriber_partition: NAVIGATION
      output:
        participant: platform_lan
        writer_qos: lan_status_1hz

  - name: platform_detail_status
    enabled: false
    forwarding_mode: dynamic_data
    source: platform
    destination: control
    topics:
      - name: PlatformDetailStatus
      - name: PlatformMissionStatus
      - name: PlatformWaypointStatus
    source_side:
      input:
        participant: platform_lan
      output:
        participant: platform_wan
        writer_qos: wan_status
        publisher_partition: PLATFORM
    destination_side:
      enabled: true   # D120: C2 relay always ready; gating is source-side only
      input:
        participant: control_wan
        reader_qos: wan_status
        subscriber_partition: PLATFORM
      output:
        participant: control_lan

  - name: platform_debug_status
    enabled: false
    forwarding_mode: dynamic_data
    source: platform
    destination: control
    topics:
      - name: PlatformDebugStatus
      - name: PlatformThrusterStatus
      - name: PlatformPowerStatus
      - name: ActRouterDiagnostics
    source_side:
      input:
        participant: platform_lan
      output:
        participant: platform_wan
        writer_qos: wan_status
        publisher_partition: PLATFORM
    destination_side:
      enabled: true   # D120: C2 relay always ready; gating is source-side only
      input:
        participant: control_wan
        reader_qos: wan_status
        subscriber_partition: PLATFORM
      output:
        participant: control_lan

  - name: platform_command_ack
    enabled: true
    forwarding_mode: dynamic_data
    source: platform
    destination: control
    topics:
      - name: PlatformCommandAck
    source_side:
      input:
        participant: platform_lan
        reader_qos: lan_event
      output:
        participant: platform_wan
        writer_qos: wan_event
        publisher_partition: PLATFORM
    destination_side:
      input:
        participant: control_wan
        reader_qos: wan_event
        subscriber_partition: PLATFORM
      output:
        participant: control_lan
        writer_qos: lan_event

  - name: platform_events
    enabled: true
    forwarding_mode: dynamic_data
    source: platform
    destination: control
    topics:
      - name: ContactReport
    source_side:
      input:
        participant: platform_lan
      output:
        participant: platform_wan
        writer_qos: wan_event
        publisher_partition: PLATFORM
    destination_side:
      input:
        participant: control_wan
        reader_qos: wan_event
        subscriber_partition: PLATFORM
      output:
        participant: control_lan

  # Platform<->platform team routes (D80/D83; historically platform-team.yaml's flat
  # form, now folded into this single system-wide config in role-pair form). Both
  # legs are role "platform", so each direction is its own route and both always
  # resolve to source_side (D80). Omitted endpoint partitions opt into platform_wan's
  # team endpoint set; the participant itself remains globally discoverable.
  - name: platform_team_to_wan
    enabled: true
    forwarding_mode: dynamic_data
    source: platform
    destination: platform
    source_side:
      input:
        participant: platform_lan
      output:
        participant: platform_wan
        writer_qos: wan_status
    topics:
      - name: PlatformData

  - name: wan_team_to_platform
    enabled: true
    forwarding_mode: dynamic_data
    source: platform
    destination: platform
    source_side:
      input:
        participant: platform_wan
        reader_qos: wan_status
      output:
        participant: platform_lan
    topics:
      - name: PlatformData
